<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outreach Dashboard — HyperNexus</title>
<style>
  :root { --bg:#0a0a0f; --card:#14141d; --border:#2a2a3a; --text:#e0e0e0; --dim:#888; --accent:#ff3b30; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; padding:24px; }
  h1 { font-size:24px; margin-bottom:4px; }
  .sub { color:var(--dim); margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
  .card .label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .card .value { font-size:32px; font-weight:700; }
  .card .value.accent { color:var(--accent); }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; }
  th, td { padding:12px 16px; text-align:left; border-bottom:1px solid var(--border); font-size:14px; }
  th { background:#1a1a24; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1px; }
  tr:hover { background:#1c1c28; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .badge.sent { background:rgba(76,217,100,.15); color:#4cd964; }
  .badge.failed { background:rgba(255,59,48,.15); color:#ff3b30; }
  .badge.replied { background:rgba(90,200,250,.15); color:#5ac8fa; }
  .badge.opened { background:rgba(255,204,0,.15); color:#ffcc00; }
  .refresh { position:fixed; top:24px; right:24px; background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-weight:600; cursor:pointer; }
  .refresh:hover { opacity:.85; }
  .empty { padding:40px; text-align:center; color:var(--dim); }
</style>
</head>
<body>
<button class="refresh" onclick="location.reload()">⟳ Refresh</button>
<h1>📬 Outreach Dashboard</h1>
<div class="sub">HyperNexus cold email automation — live tracking</div>
<div class="grid" id="stats"></div>
<div id="content"></div>

<script>
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderStats(data) {
  const statsEl = document.getElementById('stats');
  const items = [
    { label: 'Total Sent', value: data.sent || 0 },
    { label: 'Unique Contacts', value: data.unique || 0 },
    { label: 'Replies', value: data.replies || 0, accent: true },
    { label: 'Opens', value: data.opens || 0 },
    { label: 'Failed', value: data.failed || 0 },
  ];
  items.forEach(s => {
    const card = el('div', 'card');
    card.appendChild(el('div', 'label', s.label));
    const value = el('div', 'value' + (s.accent ? ' accent' : ''), String(s.value));
    card.appendChild(value);
    statsEl.appendChild(card);
  });
}

function renderEmpty() {
  const content = document.getElementById('content');
  const empty = el('div', 'empty');
  empty.appendChild(document.createTextNode('No outreach emails yet. Run '));
  const code = el('code');
  code.textContent = 'python scripts/outreach/outreach_top100.py';
  empty.appendChild(code);
  content.appendChild(empty);
}

function renderTable(recent) {
  const content = document.getElementById('content');
  const table = el('table');
  const thead = el('thead');
  const headRow = el('tr');
  ['Date', 'Company', 'Email', 'Category', 'Status'].forEach(h => {
    headRow.appendChild(el('th', null, h));
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el('tbody');
  recent.forEach(r => {
    const row = el('tr');
    row.appendChild(el('td', null, r.sent_at ? new Date(r.sent_at).toLocaleString() : '-'));
    row.appendChild(el('td', null, r.company_name || '-'));
    row.appendChild(el('td', null, r.contact_email));
    row.appendChild(el('td', null, r.category || '-'));
    const badge = el('span', 'badge ' + (r.status || ''));
    badge.textContent = r.status || '-';
    const statusTd = el('td');
    statusTd.appendChild(badge);
    row.appendChild(statusTd);
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  content.appendChild(table);
}

function renderError(msg) {
  const content = document.getElementById('content');
  content.appendChild(el('div', 'empty', 'Error loading: ' + msg));
}

async function load() {
  try {
    const res = await fetch('/api/v1/outreach/stats');
    const data = await res.json();
    renderStats(data);
    if (!data.recent || !data.recent.length) {
      renderEmpty();
      return;
    }
    renderTable(data.recent);
  } catch (e) {
    renderError(e.message);
  }
}
load();
</script>
</body>
</html>
